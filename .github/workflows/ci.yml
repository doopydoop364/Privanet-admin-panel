name: Chat Admin CI

on:
  push:
    branches:
      - main
      - 'v0.3.*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Compile
        run: python -m compileall -q agent authorize.py twofactor.py
      - name: Test
        run: python -m pytest -q

[project]
name = "privanet-chat-admin"
version = "0.3.3.2"
description = "Sandboxed conversational admin bridge for PrivaNet"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent"]
